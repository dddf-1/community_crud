<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e3a857"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>
      .box{fill:#1c2128;stroke:#adbac7;stroke-width:1.3}
      .ext{fill:#1c2128;stroke:#636e7b;stroke-width:1.3}
      .db{fill:#1c2128;stroke:#8ddb8c;stroke-width:1.3}
      .mon{fill:#1c2128;stroke:#b392f0;stroke-width:1.3}
      .t{font-size:15px;fill:#e6edf3;text-anchor:middle}
      .s{font-size:12px;fill:#9ba7b4;text-anchor:middle}
      .h{font-size:24px;fill:#e6edf3}
      .lg{font-size:13px}
      .ln{stroke:#c9d1d9;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .dp{stroke:#e3a857;stroke-width:1.4;fill:none;stroke-dasharray:5 4;marker-end:url(#o)}
      .cf{stroke:#8b949e;stroke-width:1.4;fill:none;stroke-dasharray:5 4;marker-end:url(#g)}
    </style>
  </defs>
  <rect width="1200" height="690" fill="#0d1117"/>

  <text x="30" y="46" class="h">howareyoujake 아키텍처</text>
  <path d="M760,38 H795" class="ln"/><text x="803" y="42" class="lg" fill="#c9d1d9">요청</text>
  <path d="M860,38 H895" class="dp"/><text x="903" y="42" class="lg" fill="#e3a857">빌드와 배포</text>
  <path d="M1000,38 H1035" class="cf"/><text x="1043" y="42" class="lg" fill="#9ba7b4">설정 주입</text>

  <!-- Kubernetes cluster -->
  <rect x="300" y="90" width="660" height="390" rx="10" fill="#111823" stroke="#4c7ab0" stroke-width="1.3"/>
  <text x="318" y="116" font-size="14" fill="#79b8ff">Kubernetes Cluster</text>

  <!-- request flow -->
  <rect x="30" y="150" width="100" height="60" rx="6" class="ext"/>
  <text x="80" y="186" class="t">사용자</text>
  <rect x="160" y="150" width="120" height="60" rx="6" class="ext"/>
  <text x="220" y="176" class="t">AWS</text>
  <text x="220" y="196" class="s">Load Balancer</text>
  <text x="222" y="140" class="s">HTTPS</text>

  <rect x="320" y="150" width="150" height="60" rx="6" class="box"/>
  <text x="395" y="176" class="t">Ingress</text>
  <text x="395" y="196" class="s">nginx</text>
  <rect x="500" y="150" width="150" height="60" rx="6" class="box"/>
  <text x="575" y="176" class="t">Service</text>
  <text x="575" y="196" class="s">ClusterIP 8080</text>

  <rect x="680" y="110" width="180" height="160" rx="8" fill="none" stroke="#636e7b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <rect x="700" y="128" width="140" height="46" rx="6" class="box"/>
  <text x="770" y="149" class="t">Pod 1</text>
  <text x="770" y="165" class="s">Spring Boot</text>
  <rect x="700" y="188" width="140" height="46" rx="6" class="box"/>
  <text x="770" y="209" class="t">Pod 2</text>
  <text x="770" y="225" class="s">Spring Boot</text>
  <text x="770" y="257" class="s">Deployment  롤링 업데이트</text>

  <rect x="1000" y="150" width="170" height="60" rx="6" class="db"/>
  <text x="1085" y="176" class="t">MySQL</text>
  <text x="1085" y="196" class="s">클러스터 밖 EC2</text>

  <path d="M130,180 H157" class="ln"/>
  <path d="M280,180 H317" class="ln"/>
  <path d="M470,180 H497" class="ln"/>
  <path d="M650,180 H677" class="ln"/>
  <path d="M860,180 H997" class="ln"/>
  <text x="930" y="172" class="s" style="fill:#8ddb8c">DB 접속</text>

  <!-- config and gitops -->
  <rect x="690" y="320" width="160" height="56" rx="6" class="box"/>
  <text x="770" y="344" class="t">ConfigMap  Secret</text>
  <text x="770" y="363" class="s">DB 주소  계정  JWT 키</text>
  <path d="M770,320 V273" class="cf"/>

  <rect x="320" y="320" width="150" height="56" rx="6" class="box"/>
  <text x="395" y="344" class="t">Argo CD</text>
  <text x="395" y="363" class="s">자동 동기화</text>
  <path d="M470,348 H665 V240 H677" class="dp"/>

  <rect x="40" y="320" width="190" height="56" rx="6" class="ext"/>
  <text x="135" y="344" class="t">community-gitops</text>
  <text x="135" y="363" class="s">Helm Chart</text>
  <path d="M230,348 H317" class="dp"/>

  <!-- monitoring -->
  <text x="320" y="403" font-size="12" fill="#b392f0">모니터링</text>
  <rect x="320" y="412" width="140" height="48" rx="6" class="mon"/>
  <text x="390" y="433" class="t">Prometheus</text>
  <text x="390" y="450" class="s">지표</text>
  <rect x="480" y="412" width="140" height="48" rx="6" class="mon"/>
  <text x="550" y="433" class="t">Loki</text>
  <text x="550" y="450" class="s">로그</text>
  <rect x="640" y="412" width="140" height="48" rx="6" class="mon"/>
  <text x="710" y="433" class="t">Grafana</text>
  <text x="710" y="450" class="s">조회</text>

  <!-- CI -->
  <text x="40" y="545" font-size="14" fill="#e3a857">CI</text>
  <rect x="40" y="560" width="170" height="56" rx="6" class="ext"/>
  <text x="125" y="584" class="t">community_crud</text>
  <text x="125" y="603" class="s">코드 push</text>
  <rect x="250" y="560" width="190" height="56" rx="6" class="ext"/>
  <text x="345" y="584" class="t">GitHub Actions</text>
  <text x="345" y="603" class="s">테스트  이미지 빌드</text>
  <rect x="480" y="560" width="230" height="56" rx="6" class="ext"/>
  <text x="595" y="584" class="t">Private Registry</text>
  <text x="595" y="603" class="s">registry.howareyoujake.com</text>
  <path d="M210,588 H247" class="dp"/>
  <path d="M440,588 H477" class="dp"/>
  <path d="M710,588 H900 V211 H843" class="dp"/>
  <text x="892" y="400" class="s" style="fill:#e3a857;text-anchor:end">image pull</text>
  <text x="345" y="645" class="s">AWS는 OIDC로 인증하고 레지스트리 계정은 SSM에서 읽음</text>
</svg>
