name: Backend CI - Build and Push

on:
  push:
    branches:
      - first_modify
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: community-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Run backend tests
        run: ./gradlew test --no-daemon
        env:
            SPRING_PROFILES_ACTIVE: test

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          allowed-account-ids: "921829859064"

      - name: Login to private Docker Registry
        shell: bash
        run: |
          set -euo pipefail

          REGISTRY_USERNAME="$(aws ssm get-parameter \
            --name "${{ secrets.REGISTRY_USERNAME_PARAMETER }}" \
            --query "Parameter.Value" \
            --output text)"

          REGISTRY_PASSWORD="$(aws ssm get-parameter \
            --name "${{ secrets.REGISTRY_PASSWORD_PARAMETER }}" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)"

          echo "::add-mask::$REGISTRY_USERNAME"
          echo "::add-mask::$REGISTRY_PASSWORD"

          printf '%s' "$REGISTRY_PASSWORD" |
            docker login "${{ secrets.REGISTRY_URL }}" \
              --username "$REGISTRY_USERNAME" \
              --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA}" \
            .

      - name: Push Docker image
        run: |
          docker push \
            "${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA}"

      - name: Print pushed image
        run: |
          echo "Pushed image:"
          echo "${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA}"
